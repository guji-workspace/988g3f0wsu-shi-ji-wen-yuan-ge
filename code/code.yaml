# 本书的书级代码（open-guji-cv ≥0.7.0 挂成 guji_book.shiji_wyg）。设计：cv doc/design/书级代码.md。
# 改了本目录的代码：本仓提交 → guji code release -w <本仓根> 出 releases/k<N+1>.json → 打 tag k<N+1>。
name: shiji_wyg            # ＝册配置的 seg_set
base: keben
cv: ">=0.7.43"         # k17（11-16 r71）：variant_rank 改刻形版（Sheldon 11-16 文字层照刻形写：库里异体排在参校本字前才放、放刻形）；k16（11-16 r71）：follow_ref_rival 加 variant_rank 钩子（Sheldon 11-15 圗兾凢来 不并码位、改流水线放行；开 圖圗／冀兾／凡凢／來来），要 cv 带 #1573（v0.7.43＝v0.7.41＋#1573）；k15（11-15 r71）：下限改 0.7.41（v0.7.39＋#1565 sb 卜否决补 4 条），代码同 k13；k14（11-15 r70）：下限改 0.7.39（v0.7.38＋#1558 sb 卜否决＋#1557；防误用旧 cv），代码同 k13；k13：follow_ref_rival 加 variant_norm 钩子（A24 r68），要 cv 带 #1554（A31 出的 v0.7.33＋#1554 patch，钉版另定）；k12 同 k11（同族钩子放宽，纯书码）；k11 起要 cv ≥0.7.33（= v0.7.32 + #1523 align_ref.coord_legacy_line_guard，缺省关，2026-11-14）；k9/k10 起要 cv 带 follow_ref_hooks 钩子（cv #1517，史記 patch 线 v0.7.32，2026-11-13；v0.7.30/31 是 dev 线，不含钩子）； k4 起要 cv 带 patch_clean 钩子（cv #1408，2026-11-10）；k2 起要 cv 带 seal_ink／free_split 钩子（2026-11-10）；≥0.7.1 起登了等价、row_segment 不过期
overrides:
  keben.roster_segment: roster_segment
  keben.roster_glyph: roster_glyph
  keben.jiazhu_step: jiazhu_step     # 雙行小注逐步切＋两行字数可不等（free_split）
  keben.seal_ink: seal_ink           # 大印下剔印泥、表中间空格位记空
  keben.patch_clean: patch_clean     # 发前清格：抹邻格残笔、界行、列端版框横线（格框格号不动）
  keben.follow_ref_hooks: follow_ref_rival   # follow_ref 领先差：同族异体不当对手（k9，cv#1517 钩子）
