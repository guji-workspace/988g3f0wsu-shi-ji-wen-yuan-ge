# 控制台 URL 上露出来的工作区 id（`/<ws>/<book>/step/...`）。
# 不给就退回目录名——本仓目录名是 `<book-index id>-<书名>`，整串中文进 URL 太长，
# 这里固定成短 id。见 open-guji-cv `console/routers/workspace.py::_ws_id`。
id: 988g3f0wsu   # 工作区 id＝book ID（2026-10-28 起；短 id 长期会冲突）
# 字形库：本书是手写本（文淵閣寫本），只用本书自己的刻例库。
# 2026-11-10 撤借库（Sheldon 定；原借全唐文 995ejelvk0 human+auto g1），与中心库 workspace.yaml 一致；字形库钉 g10（无借库快照）。
# 2026-11-18 放行格自动回库（guji-manager #624 起缺省开）史记先关：保持「史记自己推库、出快照、人裁入库」口径，
# witness3 有整理本×参校本同错的误放（如 40:182:2:3 記→訖），回库会带进错刻例。字形库线抽 100 格看图评估后再决定开不开。
# 2026-11-19 库文一致核对（guji-manager #694 起缺省 apply：自动改机器刻例标、撤错位例）史记只报告：
# 改库一律走字形库线人看后推库、出快照，不让跑批机上整册跑完就改库。
glyph_lib:
  auto_backfill: false
  text_check: report

# 2026-11-20 收轮检查（guji-manager v0.4.69 roundcheck）待审分层口径（总览同意）：
# 判序 seg→group→lib（与全唐文 cls36 同序，三书可比）；层号仍按史记四层法叫：1 切分、2 库缺样本、3 形近字组、4 其余。
round_check:
  order: [seg, group, lib]
  cov_min: 0.90
  lib_min: 5
  seg_defect: true           # 11-20 试点 #5942：关着时 r80 两处已知真错（42:137:4、42:28:3，CLIP）漏报；r80 本地闸是开着的
